{% extends "base.html" %}

{% block content %}
    <div style="text-align: center; margin-top: 50px;">
        <h1>Добро пожаловать в наш блог!</h1>
        <p class="subtitle">Чтобы получить доступ к дневнику, пожалуйста, авторизуйтесь.</p>
        
        <div style="margin-top: 30px;">
            <a href="{{ url_for('register') }}" style="text-decoration: none;">
                <button type="button" style="background-color: #2b6cb0; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; margin-right: 15px;">Регистрация</button>
            </a>
            <a href="{{ url_for('login') }}" style="text-decoration: none;">
                <button type="button" style="background-color: #48bb78; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer;">Войти</button>
            </a>
        </div>
    </div>
{% endblock %}
